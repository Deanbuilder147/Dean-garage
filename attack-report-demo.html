<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>战斗结算窗口 · 演示</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 70% -10%, #16233f 0%, transparent 60%),
      linear-gradient(180deg, #070b16, #04060d);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8eefc;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 12px 48px;
  }
  .demo-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .demo-bar button {
    background: linear-gradient(180deg, #18294a, #0e1a33);
    color: #cfe0ff;
    border: 1px solid #2b3f6b;
    border-radius: 9px;
    padding: 9px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: .18s;
  }
  .demo-bar button:hover { border-color: #3f5d9c; color: #fff; }
  .demo-bar button.active {
    background: linear-gradient(180deg, #234a86, #143061);
    border-color: #4c7cd6;
    color: #fff;
  }
  .hint { color: #7f8fae; font-size: 12px; margin-bottom: 18px; text-align: center; }

  /* ===== 结算窗口（对齐 AttackReportModal.vue） ===== */
  .attack-report-overlay {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .attack-report-card {
    width: min(720px, 92vw);
    max-height: 90vh;
    overflow: auto;
    background: linear-gradient(160deg, #0e1730, #0a1226);
    border: 1px solid #2b3f6b;
    border-radius: 14px;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.55);
    color: #e8eefc;
  }
  .ar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid #21304f;
    background: linear-gradient(90deg, #16335c, #0e1d3a);
    border-radius: 14px 14px 0 0;
  }
  .ar-header.blocked { background: linear-gradient(90deg, #5c1f16, #3a140e); }
  .ar-title { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
  .ar-close {
    background: transparent; border: none; color: #9fb0d0;
    font-size: 18px; cursor: pointer;
  }
  .ar-close:hover { color: #fff; }
  .ar-body {
    display: flex; align-items: stretch; gap: 8px; padding: 16px;
  }
  .ar-unit {
    flex: 1;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid #243454;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
  }
  .ar-attacker { border-top: 3px solid #4caf50; }
  .ar-defender { border-top: 3px solid #f44336; }
  .ar-unit-name {
    font-weight: 600; font-size: 14px; margin-bottom: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ar-unit-tag {
    display: inline-block; font-size: 11px; padding: 1px 8px;
    border-radius: 10px; color: #fff; margin-bottom: 8px;
  }
  .ar-sprite {
    height: 150px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 60%, #1b2b4d, #0a1326);
    border-radius: 8px; overflow: hidden;
  }
  .ar-sprite img { max-height: 100%; max-width: 100%; object-fit: contain; }
  .ar-sprite-ph { color: #5e6e8f; font-size: 13px; }
  .ar-hp { margin-top: 10px; }
  .ar-hp-bar {
    height: 10px; background: #1a2742; border-radius: 6px; overflow: hidden;
  }
  .ar-hp-fill { height: 100%; transition: width .3s; }
  .ar-hp-text { font-size: 12px; margin-top: 4px; color: #c4d0e6; }
  .ar-vs {
    align-self: center; font-size: 20px; font-weight: 800; color: #ffce54;
  }
  .ar-formula { padding: 12px 16px 18px; border-top: 1px solid #21304f; }
  .ar-formula-title {
    font-size: 13px; color: #9fb0d0; margin-bottom: 8px; letter-spacing: 1px;
  }
  .ar-step {
    display: grid; grid-template-columns: 120px 64px 1fr;
    align-items: baseline; gap: 8px; padding: 5px 0;
    border-bottom: 1px dashed #1c2a47;
  }
  .ar-step-label { color: #d4def0; font-size: 13px; }
  .ar-step-value { font-weight: 700; color: #ffce54; text-align: right; }
  .ar-step-desc { color: #8294b4; font-size: 12px; }
  .ar-step.subtotal { background: rgba(255, 255, 255, 0.04); }
  .ar-step.subtotal .ar-step-label { font-weight: 600; }
  .ar-step.final {
    border-bottom: none; border-top: 2px solid #2b3f6b;
    margin-top: 4px; padding-top: 8px;
  }
  .ar-step.final .ar-step-label,
  .ar-step.final .ar-step-value { color: #ff7a59; font-size: 15px; }
  .ar-step.counter .ar-step-value { color: #59c2ff; }
  .ar-step.warn .ar-step-value { color: #ff5252; }
  .ar-result { margin-top: 10px; font-size: 14px; color: #e8eefc; }
  .ar-result b { color: #ff7a59; }
  .ar-miss { color: #ff5252 !important; }
  .ar-block-reason {
    background: rgba(255, 82, 82, 0.08);
    border: 1px solid #5c1f16;
    border-radius: 8px; padding: 12px 14px;
    color: #ffc9c0; font-size: 13px; line-height: 1.7; white-space: pre-line;
  }
</style>
</head>
<body>
  <div class="demo-bar">
    <button id="btn-success" class="active" onclick="showReport('success')">⚔ 战斗结算（命中）</button>
    <button id="btn-dodge" onclick="showReport('dodge')">💨 战斗结算（被闪避）</button>
    <button id="btn-counter" onclick="showReport('counter')">⚡ 战斗结算（含反击）</button>
    <button id="btn-blocked" onclick="showReport('blocked')">⚠ 攻击被拦截</button>
  </div>
  <div class="hint">本页面为 AttackReportModal.vue 的独立 HTML5 演示，纯本地渲染，无外部依赖。</div>

  <div id="root" class="attack-report-overlay"></div>

<script>
  // 阵营色板（对齐组件 FACTION_MAP）
  const FACTION_MAP = {
    earth:   { label: '地球', color: '#4caf50' },
    balon:   { label: '拜隆', color: '#9c27b0' },
    mars:    { label: '火星', color: '#f44336' },
    neutral: { label: '中立', color: '#ffb000' },
  };
  function facInfo(f) { return FACTION_MAP[f] || { label: f || '未知阵营', color: '#8892a0' }; }

  // 用 inline SVG 模拟“右下/左下视图”机体图，避免依赖外部图片
  function mechSVG(color, label) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="180" height="150" viewBox="0 0 180 150">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${color}"/><stop offset="1" stop-color="#0b1426"/>
      </linearGradient></defs>
      <ellipse cx="90" cy="132" rx="52" ry="9" fill="rgba(255,255,255,0.07)"/>
      <rect x="74" y="40" width="32" height="58" rx="8" fill="url(#g)" stroke="${color}" stroke-width="1.5"/>
      <circle cx="90" cy="34" r="14" fill="${color}" stroke="#0b1426" stroke-width="2"/>
      <rect x="58" y="52" width="14" height="40" rx="6" fill="${color}" opacity="0.85"/>
      <rect x="108" y="52" width="14" height="40" rx="6" fill="${color}" opacity="0.85"/>
      <rect x="68" y="96" width="14" height="26" rx="5" fill="#1b2b4d" stroke="${color}"/>
      <rect x="98" y="96" width="14" height="26" rx="5" fill="#1b2b4d" stroke="${color}"/>
      <rect x="86" y="20" width="8" height="14" fill="${color}"/>
      <text x="90" y="146" text-anchor="middle" fill="#9fb0d0" font-size="10" font-family="sans-serif">${label}</text>
    </svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  function hpPct(u) {
    const max = u.maxHp || u.hp || 1;
    const hp = u.hp ?? 0;
    return Math.max(0, Math.min(100, (hp / max) * 100));
  }
  function hpColor(pct) {
    if (pct > 60) return '#4caf50';
    if (pct > 30) return '#ffb300';
    return '#f44336';
  }

  // ===== 示例数据 =====
  const attacker = {
    name: '麦德雷特 据点突击型', faction: 'earth', hp: 70, maxHp: 70,
  };
  const defenderOK = {
    name: '巴隆 重装卫队', faction: 'balon', hp: 126, maxHp: 140,
  };
  const defenderPre = {
    name: '巴隆 前哨侦察兵', faction: 'balon', hp: 58, maxHp: 80,
  };
  // 给两个单位挂上视图图（用 SVG 占位，真实环境为 viewUrls['2'] / viewUrls['3']）
  attacker.viewUrls  = { '2': mechSVG('#4caf50', '攻击方 · 右下'), };
  defenderOK.viewUrls  = { '3': mechSVG('#9c27b0', '防御方 · 左下'), };
  defenderPre.viewUrls = { '3': mechSVG('#9c27b0', '防御方 · 左下'), };

  const formulaHit = [
    { label: '基础攻击力', value: 29, desc: '格斗属性' },
    { label: '骰子加成', value: 2, desc: '1d6=5 ≥ 成功线 4' },
    { label: '高地加成', value: 0, desc: '无高度差' },
    { label: '小计', value: 31, isSubtotal: true },
    { label: '抗性减伤', value: -6, desc: '伤害类型 kinetic vs 防御 armor' },
    { label: '地形减伤', value: -15, desc: '地形 forest' },
    { label: '最终伤害', value: 10, isFinal: true },
  ];
  const formulaCounter = [
    { label: '基础攻击力', value: 29, desc: '格斗属性' },
    { label: '骰子加成', value: 2, desc: '1d6=5 ≥ 成功线 4' },
    { label: '高地加成', value: 0, desc: '无高度差' },
    { label: '小计', value: 31, isSubtotal: true },
    { label: '抗性减伤', value: -6, desc: '伤害类型 kinetic vs 防御 armor' },
    { label: '地形减伤', value: -15, desc: '地形 forest' },
    { label: '最终伤害', value: 10, isFinal: true },
    { label: '反击伤害(反向)', value: 7, desc: '受击方自动反击', isCounter: true },
  ];
  const formulaDodge = [
    { label: '基础攻击力', value: 29, desc: '格斗属性' },
    { label: '骰子加成', value: 2, desc: '1d6=5 ≥ 成功线 4' },
    { label: '高地加成', value: 0, desc: '无高度差' },
    { label: '小计', value: 31, isSubtotal: true },
    { label: '抗性减伤', value: -6, desc: '伤害类型 kinetic vs 防御 armor' },
    { label: '地形减伤', value: -15, desc: '地形 forest' },
    { label: '最终伤害', value: 10, isFinal: true },
    { label: '⚠ 被闪避', value: 0, desc: '闪避率 35%', isFinal: true, warn: true },
  ];

  const REPORTS = {
    success: { blocked: false, attacker, target: defenderOK,  formula: formulaHit,    finalDamage: 10, dodged: false },
    dodge:   { blocked: false, attacker, target: defenderOK,  formula: formulaDodge,  finalDamage: 10, dodged: true  },
    counter: { blocked: false, attacker, target: defenderPre, formula: formulaCounter, finalDamage: 10, dodged: false },
    blocked: {
      blocked: true,
      attacker: { name: '麦德雷特 据点突击型', faction: 'earth' },
      target: { name: '巴隆 重装卫队', faction: 'balon' },
      reason: '当前行动阵营为 拜隆，你选中的 地球 阵营单位无法发起攻击。\n\n请等待该单位所属阵营（地球）的回合，或当前为对应阵营回合时再行动。',
    },
  };

  function renderUnit(u, viewKey, cls) {
    const fi = facInfo(u.faction);
    const pct = hpPct(u);
    const src = (u.viewUrls && (u.viewUrls[String(viewKey)] || u.viewUrls[viewKey])) || '';
    const sprite = src
      ? `<img src="${src}" alt="${cls}视图" />`
      : `<div class="ar-sprite-ph">${viewKey === 2 ? '右下视图' : '左下视图'}</div>`;
    const hpBlock = (u.hp != null) ? `
      <div class="ar-hp">
        <div class="ar-hp-bar">
          <div class="ar-hp-fill" style="width:${pct}%;background:${hpColor(pct)}"></div>
        </div>
        <div class="ar-hp-text">HP ${u.hp} / ${u.maxHp}</div>
      </div>` : '';
    return `
      <div class="ar-unit ${cls}">
        <div class="ar-unit-name">${u.name || (cls === 'ar-attacker' ? '攻击方' : '防御方')}</div>
        <div class="ar-unit-tag" style="background:${fi.color}">${fi.label}</div>
        <div class="ar-sprite">${sprite}</div>
        ${hpBlock}
      </div>`;
  }

  function render(report) {
    const blocked = !!report.blocked;
    let formulaHtml;
    if (blocked) {
      formulaHtml = `<div class="ar-block-reason">${report.reason}</div>`;
    } else {
      const steps = report.formula.map(s => {
        const cls = ['ar-step'];
        if (s.isSubtotal) cls.push('subtotal');
        if (s.isFinal) cls.push('final');
        if (s.isCounter) cls.push('counter');
        if (s.warn) cls.push('warn');
        const valStr = (s.value > 0 || s.isFinal || s.warn) ? ('+' + s.value) : ('' + s.value);
        const desc = s.desc ? `<div class="ar-step-desc">${s.desc}</div>` : '';
        return `<div class="${cls.join(' ')}">
          <div class="ar-step-label">${s.label}</div>
          <div class="ar-step-value">${valStr}</div>
          ${desc}
        </div>`;
      }).join('');
      const result = report.dodged
        ? `<b class="ar-miss">被闪避，未造成伤害</b>`
        : `对防御方造成 <b>${report.finalDamage}</b> 点伤害`;
      formulaHtml = `
        <div class="ar-formula-title">伤害计算公式</div>
        ${steps}
        <div class="ar-result">结算结果：${result}</div>`;
    }

    return `
      <div class="attack-report-card">
        <div class="ar-header ${blocked ? 'blocked' : ''}">
          <span class="ar-title">${blocked ? '⚠ 攻击被拦截' : '⚔ 战斗结算'}</span>
          <button class="ar-close" onclick="alert('关闭事件（演示）')">✕</button>
        </div>
        <div class="ar-body">
          ${renderUnit(report.attacker, 2, 'ar-attacker')}
          <div class="ar-vs">${blocked ? '🚫' : 'VS'}</div>
          ${renderUnit(report.target, 3, 'ar-defender')}
        </div>
        <div class="ar-formula">${formulaHtml}</div>
      </div>`;
  }

  function showReport(key) {
    document.getElementById('root').innerHTML = render(REPORTS[key]);
    ['success','dodge','counter','blocked'].forEach(k => {
      document.getElementById('btn-' + k).classList.toggle('active', k === key);
    });
  }

  showReport('success');
</script>
</body>
</html>
