# ============================================================
# Phase 29-TrueFinal: 大一统 Compose 网络强并线
# 核心三件套: PostgreSQL + mecha-gateway:3006 + frontend:8081
# 全部死锁在同一 mecha-universe-engine_mecha-net 网格中
# ============================================================
services:

  # ──────────────────────────────────────────────
  # 持久层: PostgreSQL
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:14-alpine
    container_name: mecha-battle-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mecha_battle}
      POSTGRES_USER: ${POSTGRES_USER:-mecha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mecha_user_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mecha-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mecha_user -d mecha_battle"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # ★ 大一统后端网关 (Port 3006) ★
  # Phase 29-X: 统一认证/机库/地图/词条/房间/管理 全部端点
  # ──────────────────────────────────────────────
  mecha-gateway:
    build:
      context: .
      dockerfile: backend-gateway/Dockerfile
    image: mecha-gateway:latest
    container_name: mecha-gateway
    ports:
      - "3006:3006"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3006
      DB_PATH: /data/mecha-universe.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://106.54.197.69:8081}
    volumes:
      - gateway_data:/data
    networks:
      - mecha-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # 前端表现层 (Port 8081 → Nginx 内部 :80)
  # Nginx 反代 /api/* → mecha-gateway:3006 (同网格直通)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mecha-frontend
    ports:
      - "8081:80"
    environment:
      VITE_API_BASE: /api
      GATEWAY_HOST: mecha-gateway
      GATEWAY_PORT: 3006
    networks:
      - mecha-net
    depends_on:
      - mecha-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# ──────────────────────────────────────────────
# 持久卷
# ──────────────────────────────────────────────
volumes:
  postgres_data:
  gateway_data:

# ──────────────────────────────────────────────
# ★ 大一统网络网格 ★
# 名称固定: mecha-universe-engine_mecha-net
# 杜绝跨网络 502
# ──────────────────────────────────────────────
networks:
  mecha-net:
    name: mecha-universe-engine_mecha-net
    driver: bridge
