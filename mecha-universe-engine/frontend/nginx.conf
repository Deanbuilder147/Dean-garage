# ============================================================
# Phase 29-X 最高图腾令 — 大一统 Nginx 配置
# 监听 80 端口，CSP + HSTS + 安全响应头全覆盖
# ============================================================

server {
    listen 80;
    server_name _;

    # 请求体大小限制
    client_max_body_size 50m;
    client_body_buffer_size 128k;

    # ========================================
    # Phase 29-X 安全响应头（全局）
    # ========================================
    # Content-Security-Policy: 大一统安全策略
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'none';" always;

    # HSTS: 强制 HTTPS（生产环境启用）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 防 MIME 嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # 防点击劫持
    add_header X-Frame-Options "DENY" always;

    # 引用策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 权限策略
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ========================================
    # 静态文件 — SPA fallback
    # ========================================
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ========================================
    # API 反向代理 — 大一统网关 (3006)
    # ========================================
    location /api/ {
        proxy_pass http://mecha-gateway:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ========================================
    # WebSocket — 观战服务 (3005)
    # ========================================
    location /socket.io/ {
        proxy_pass http://mecha-comm:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ========================================
    # 健康检查端点
    # ========================================
    location /health {
        proxy_pass http://mecha-gateway:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
