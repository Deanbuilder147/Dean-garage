server {
    listen 80;
    client_max_body_size 50m;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

# ══════════════════════════════════════════
# Phase 30-CSP: 大一统 CSP 安全头
# Nginx add_header 不继承：每个 location 有任一 add_header 即断绝继承链
# 因此必须在每一个 location 块内显式注入完整 CSP 豁免规则
# 关键：worker-src 放行 OffscreenCanvas/WebWorker | frame-ancestors 防点击劫持
# ══════════════════════════════════════════

    # Phase 30-CSP: 静态资产长期缓存（带 hash 指纹，永不冲突）
    # ★ 必须在此注入 CSP：此块有 add_header Cache-Control，会断绝 server 级继承
    location /assets/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'self';" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        expires 1y;
    }

    # SPA 入口：不缓存 HTML + 全量安全头（Vue 动态编译需要 'unsafe-eval' + 'unsafe-inline' 双重豁免）
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }

    # ══════════════════════════════════════════════════════════════════════
    # API 代理层 — 统一泛匹配（消除逐模块手动枚举的根因）
    # 所有 /api/ 请求统一转发到网关 mecha-gateway:3006
    # 关键：proxy_pass 故意【不带尾斜杠】，保留 /api/ 前缀透传给后端路由
    #       （若写成 http://mecha-gateway:3006/ 会剥离 /api/ 前缀 → 后端 404）
    # 新增后端模块只需遵守 /api/ 前缀规范，nginx 零配置，不再有"漏配=全军覆没"
    # ══════════════════════════════════════════════════════════════════════

    # 调试端点：仅内网/开发使用，禁止公网访问
    # 统一泛匹配会暴露它，故用更长前缀块显式 deny（nginx 最长前缀优先）
    location /api/debug/ {
        deny all;
        return 403;
    }

    # 统一代理所有发往后端的 API 请求
    location /api/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        proxy_pass http://mecha-gateway:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.io（浏览器 → comm 实时推送；nginx 反代到 mecha-comm:3005）
    location /socket.io/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        proxy_pass http://mecha-comm:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
