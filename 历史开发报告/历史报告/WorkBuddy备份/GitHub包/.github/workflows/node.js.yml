name: Node.js CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: mecha_battle_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      matrix:
        node-version: [18.x, 20.x]
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          
      - name: Install dependencies
        run: |
          cd services/auth-service && npm install
          cd ../hangar-service && npm install
          cd ../map-service && npm install
          cd ../combat-service && npm install
          cd ../comm-service && npm install
          
      - name: Run tests
        run: |
          cd services/combat-service && npm test
        env:
          CI: true
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/mecha_battle_test
